# Build, push and deploy DAYEMON to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_REPO=dayemon,_SERVICE=dayemon
#
# Prerequisites: an Artifact Registry Docker repo named $_REPO in $_REGION, and a
# DATABASE_URL secret in Secret Manager that the Cloud Run service account can read.
substitutions:
  _REGION: europe-west1
  _REPO: dayemon
  _SERVICE: dayemon
  _DB_SECRET: dayemon-database-url
  # Cloud SQL instance to attach, as project:region:instance. Empty to skip.
  _CLOUDSQL_INSTANCE: ""

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - --cache-from=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        args=(
          run deploy "${_SERVICE}"
          --image "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
          --region "${_REGION}"
          --platform managed
          --port 8080
          --cpu 1
          --memory 512Mi
          --min-instances 0
          --max-instances 4
          --set-env-vars "LOG_LEVEL=info,NODE_ENV=production"
          --set-secrets "DATABASE_URL=${_DB_SECRET}:latest"
        )
        if [ -n "${_CLOUDSQL_INSTANCE}" ]; then
          args+=(--add-cloudsql-instances "${_CLOUDSQL_INSTANCE}")
        fi
        gcloud "${args[@]}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
